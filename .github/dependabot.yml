# Supply chain (docs/guardrails.md P2-3): reviewed update PRs for every
# dependency source. Actions and base images are pinned by digest/SHA, so an
# update only lands through one of these PRs and the full CI run.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: [dependencies, docker]

{{- if .Values.app.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "atsagent.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atsagent.labels" . | nindent 4 }}
  {{- with .Values.app.serviceAccount.googleServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ . }}
  {{- end }}
{{- end }}

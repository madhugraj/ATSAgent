# Sandboxed document parser: same image, different command. Only secret is
# PARSER_TOKEN, no database, egress denied via NetworkPolicy; reachable only
# from the app pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atsagent.fullname" . }}-parser
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atsagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: parser
spec:
  replicas: {{ .Values.parser.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "atsagent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: parser
  template:
    metadata:
      labels:
        {{- include "atsagent.labels" . | nindent 8 }}
        app.kubernetes.io/component: parser
    spec:
      automountServiceAccountToken: false
      containers:
        - name: parser
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required (short SHA)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", ".output/parser-worker/index.mjs"]
          ports:
            - { containerPort: {{ .Values.parser.service.port }}, name: http }
          env:
            - { name: PORT, value: {{ .Values.parser.service.port | quote }} }
            - name: PARSER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.parser.existingSecret }}
                  key: PARSER_TOKEN
          resources:
            {{- toYaml .Values.parser.resources | nindent 12 }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "atsagent.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atsagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "atsagent.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
  ports:
    - { port: 80, targetPort: http, name: http }

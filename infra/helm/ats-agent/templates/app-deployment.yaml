apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atsagent.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "atsagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  {{- if not .Values.app.hpa.enabled }}
  replicas: {{ .Values.app.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "atsagent.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "atsagent.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      serviceAccountName: {{ include "atsagent.fullname" . }}-app
      automountServiceAccountToken: false
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required (short SHA)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: 3000, name: http }
          envFrom:
            - secretRef: { name: {{ .Values.env.existingSecret }} }
          env:
            - name: PARSER_URL
              value: {{ include "atsagent.parserUrl" . | quote }}
            # Same secret the parser pods use, so the two cannot drift: the app
            # sends it as x-parser-token on every parse call.
            - name: PARSER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.parser.existingSecret }}
                  key: PARSER_TOKEN
            {{- range $k, $v := .Values.env.plain }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}

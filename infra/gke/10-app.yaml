# The web app: SSR pages, server functions, public APIs and webhooks.
# Image tag/digest is replaced by the pipeline (IMAGE_PLACEHOLDER).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scouts-app
  namespace: scouts
spec:
  replicas: 2
  selector: { matchLabels: { app: scouts-app } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: scouts-app }
    spec:
      serviceAccountName: scouts-app
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports: [{ containerPort: 3000, name: http }]
          envFrom:
            - secretRef: { name: scouts-env }
          env:
            - { name: PARSER_URL, value: "http://scouts-parser.scouts.svc.cluster.local:8080" }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { memory: "2Gi" }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scouts-app
  namespace: scouts
---
apiVersion: v1
kind: Service
metadata:
  name: scouts-app
  namespace: scouts
  annotations:
    cloud.google.com/backend-config: '{"default": "scouts-app-backend"}'
spec:
  type: ClusterIP
  selector: { app: scouts-app }
  ports: [{ port: 80, targetPort: http, name: http }]
---
# Health check on / (there is no /health route); long timeout for slow server functions.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: scouts-app-backend
  namespace: scouts
spec:
  timeoutSec: 300
  healthCheck: { type: HTTP, requestPath: /, port: 3000 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scouts-app
  namespace: scouts
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: scouts-app }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
